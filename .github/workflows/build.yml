name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $errorCount = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors)
            if ($parseErrors) {
              $errorCount++
              Write-Host $_.FullName
              $parseErrors | ForEach-Object { Write-Host $_.ToString() }
            }
          }
          if ($errorCount -gt 0) {
            throw "PowerShell parse errors: $errorCount"
          }

      - name: Compile native sources (CI)
        shell: pwsh
        run: |
          $obj = Join-Path $env:GITHUB_WORKSPACE 'native\obj\ci'
          New-Item -ItemType Directory -Force -Path $obj | Out-Null
          $src = Join-Path $env:GITHUB_WORKSPACE 'native\TaskbarClear'
          $inj = Join-Path $env:GITHUB_WORKSPACE 'native\inject-once'
          cl.exe /nologo /EHsc /O2 /MD /W3 /D_CRT_SECURE_NO_WARNINGS /DUNICODE /D_UNICODE `
            "$inj\inject-once.cpp" /Fe:"$obj\inject-once.ci.exe" /Fo:"$obj\inject-once.obj" `
            /link user32.lib psapi.lib shlwapi.lib
          cl.exe /nologo /LD /EHsc /O2 /MD /W3 /D_CRT_SECURE_NO_WARNINGS /DWIN32 /DNDEBUG /D_WINDOWS /D_USRDLL `
            /I"$src" "$src\TaskbarClear.cpp" /Fo:"$obj\TaskbarClear.obj" `
            /link /DEF:"$src\TaskbarClear.def" /DLL /MACHINE:X64 ole32.lib oleaut32.lib uuid.lib user32.lib shlwapi.lib shell32.lib WindowsApp.lib `
            /Fe:"$obj\TaskbarClear.ci.dll"

      - name: Verify release binaries and checksums
        shell: pwsh
        run: |
          foreach ($f in @('bin\inject-once.exe', 'bin\TaskbarClear.dll', 'bin\CHECKSUMS.sha256')) {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }
          .\scripts\verify-checksums.ps1
