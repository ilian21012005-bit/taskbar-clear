name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native binaries
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat')) {
            Write-Warning 'Build Tools layout may differ on runner; attempting native\build.ps1'
          }
          try {
            .\native\build.ps1
          } catch {
            Write-Warning "Build skipped or failed: $_"
            exit 0
          }

      - name: Verify prebuilt binaries exist
        shell: pwsh
        run: |
          foreach ($f in @('bin\inject-once.exe', 'bin\TaskbarClear.dll')) {
            if (-not (Test-Path $f)) { throw "Missing $f" }
          }
          .\scripts\verify-checksums.ps1

      - name: Lint PowerShell scripts
        shell: pwsh
        run: |
          $errors = 0
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { $errors++; Write-Host $_.FullName; $errs }
          }
          if ($errors -gt 0) { throw "PowerShell parse errors: $errors" }
